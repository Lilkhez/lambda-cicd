name: AWS Lambda Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'lambda/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-lambda:
    runs-on: ubuntu-latest # sets up or specify the runner
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python # Sets up python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Debug OIDC token claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | python3 -c "import sys,json,base64; p=sys.stdin.read().split('.')[1]; p+='='*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k:c[k] for k in ('iss','aud','sub')}, indent=2))"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{secrets.AWS_ROLE_ARN}}
          aws-region: ap-southeast-2

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r lambda/requirement.txt -t lambda/

      - name: Deploy Lambda Function # Zips lambda directory and update lambda function
        run: |
          cd lambda
          zip -r lambda.zip .
          aws lambda update-function-code --function-name Test-CICD-Lambda --zip-file fileb://lambda.zip 
